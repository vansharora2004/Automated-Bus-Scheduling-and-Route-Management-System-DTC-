spring:
  application:
    name: dtc-transit
  datasource:
    # Port 55432 matches docker-compose.yml, which deliberately avoids 5432 so a locally
    # installed PostgreSQL cannot be reached by accident.
    url: ${DB_URL:jdbc:postgresql://localhost:55432/dtc_transit}
    username: ${DB_USER:dtc}
    password: ${DB_PASSWORD:local_dev_only}
    hikari:
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 500
        order_inserts: true
        order_updates: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  time:
    zone: Asia/Kolkata
    service-day-start: "03:00"
  security:
    jwt:
      issuer: ${JWT_ISSUER:https://dtc-transit.local}
      audience: ${JWT_AUDIENCE:dtc-transit-api}
      access-token-ttl: 15m
      refresh-token-ttl: 7d
      # Worst-case delay before a disabled account stops being accepted. Must stay well below
      # access-token-ttl, or revocation would be slower than simply waiting for expiry.
      token-version-cache-ttl: 60s
      # PEM key pair. Left blank an ephemeral pair is generated at startup, so no secret is ever
      # committed. Production must supply both.
      private-key: ${JWT_PRIVATE_KEY:}
      public-key: ${JWT_PUBLIC_KEY:}
    lockout:
      max-failures: 5
      duration: 15m
    rate-limit:
      attempts-per-minute: 10
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    bootstrap:
      username: ${APP_SECURITY_BOOTSTRAP_USERNAME:admin}
      # No default. Without this, no admin is created.
      password: ${APP_SECURITY_BOOTSTRAP_PASSWORD:}

logging:
  level:
    root: INFO
    com.dtc.transit: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  swagger-ui:
    enabled: false
logging:
  level:
    com.dtc.transit: INFO
